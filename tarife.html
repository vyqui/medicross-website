<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Tarife — pagină mutată | Tratamente Turcia by Medicross</title>
  <meta name="description" content="Pagina de tarife a fost retrasă. Pentru prețuri și detalii, contactează echipa Tratamente Turcia by Medicross." />
  <!-- GitHub Pages is static hosting with no server config, so a real HTTP 301
       isn't available here. This is the static-site equivalent: an immediate
       (0-delay) meta refresh plus a canonical pointing at the destination —
       Google explicitly treats a 0-delay refresh as a redirect signal for
       consolidating a retired URL, and browsers honor it identically to a
       redirect for real visitors. -->
  <link rel="canonical" href="https://tratamente-turcia.ro/contact" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=contact.html" />
  <script>location.replace('contact.html');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --brand: #D42B2B; --ink: #211E1A; --muted: #6B655C; --bg: #FBF7F1; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink);
      font-family: 'Manrope', system-ui, sans-serif; text-align: center; padding: 32px;
    }
    .box { max-width: 460px; }
    h1 { font-family: 'Newsreader', Georgia, serif; font-size: 28px; margin-bottom: 14px; }
    p { color: var(--muted); font-size: 15.5px; line-height: 1.7; margin-bottom: 22px; }
    a.btn {
      display: inline-block; padding: 13px 26px; border-radius: 999px;
      background: var(--brand); color: #fff; font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <!-- Fallback content for the instant before redirect, and for anything that
       doesn't execute the script or honor the refresh (rare, but the page
       must not be a dead end for those visitors). -->
  <div class="box">
    <h1>Te redirecționăm…</h1>
    <p>Dacă vrei să afli mai multe despre calitatea și prețurile noastre, nu ezita să ne contactezi!</p>
    <a class="btn" href="contact">Mergi la pagina de Contact →</a>
  </div>
</body>
</html>
