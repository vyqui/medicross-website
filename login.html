<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Autentificare — Medicross</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500;1,6..72,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #D42B2B;
      --brand-dark: color-mix(in srgb, var(--brand) 82%, #000);
      --ink: #211E1A;
      --muted: #6B655C;
      --cream: #FBF7F1;
      --line: rgba(33, 30, 26, .1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--cream); color: var(--ink);
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 420px; background: #fff;
      border: 1px solid var(--line); border-radius: 20px; padding: 34px 32px 30px;
      box-shadow: 0 30px 60px -30px rgba(33, 30, 26, .25);
    }
    .logo { display: flex; align-items: center; gap: 10px; font-family: 'Newsreader', serif; font-weight: 600; font-size: 24px; margin-bottom: 6px; }
    .logo .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 16%, transparent); }
    .sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    label { display: block; font-weight: 700; font-size: 12.5px; margin: 14px 0 6px; }
    input {
      width: 100%; padding: 12px 14px; font: inherit; font-size: 14px;
      border: 1px solid var(--line); border-radius: 11px; background: #fff; color: inherit;
    }
    input:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }
    button {
      width: 100%; margin-top: 20px; padding: 13px; font: inherit; font-weight: 700; font-size: 14.5px;
      background: var(--brand); color: #fff; border: none; border-radius: 999px; cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }
    button:hover { background: var(--brand-dark); transform: translateY(-1px); }
    .err { display: none; margin-top: 14px; padding: 10px 13px; border-radius: 10px; background: #fdeaea; color: #a11d1d; font-size: 13px; font-weight: 600; }
    .err.show { display: block; }
    .demo {
      margin-top: 22px; padding: 13px 15px; border: 1px dashed var(--line); border-radius: 12px;
      font-size: 12px; color: var(--muted); line-height: 1.7;
    }
    .demo strong { color: var(--ink); }
    .demo code { font-family: ui-monospace, Menlo, monospace; background: #F3EEE7; padding: 1px 6px; border-radius: 6px; }
    .back { display: block; text-align: center; margin-top: 18px; font-size: 13px; font-weight: 700; color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--brand); }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><span class="dot"></span>Medicross</div>
    <div class="sub">Autentifică-te în contul tău de pacient sau în consola de administrare.</div>

    <form id="loginForm" novalidate>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
      <label for="pass">Parolă</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password" required />
      <button type="submit">Intră în cont</button>
      <div class="err" id="err">E-mail sau parolă incorecte. Încearcă din nou.</div>
    </form>

    <div class="demo">
      <strong>Conturi demo</strong> (site static — autentificarea reală vine odată cu backend-ul):<br />
      Pacient: <code>andreea@demo.ro</code> / <code>demo</code><br />
      Admin: <code>admin@medicross.ro</code> / <code>admin</code>
    </div>

    <a class="back" href="index.html">← Înapoi la site</a>
  </main>

  <script src="assets/portal-data.js"></script>
  <script>
    (function () {
      'use strict';
      var s = MedicrossDB.session();
      if (s) { location.href = s.role === 'admin' ? 'admin.html' : 'portal.html'; return; }
      document.getElementById('loginForm').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var sess = MedicrossDB.login(
          document.getElementById('email').value,
          document.getElementById('pass').value
        );
        if (sess) location.href = sess.role === 'admin' ? 'admin.html' : 'portal.html';
        else document.getElementById('err').classList.add('show');
      });
    })();
  </script>
</body>
</html>
