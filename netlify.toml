## ===============================================================
## WordPress cutover redirect map
##
## The domain serves a WordPress site with ~217 indexed URLs; this
## repository has 69. Every old URL is mapped to its closest
## equivalent so that no ranking page returns 404 the moment DNS
## moves. Blog posts, which have no counterpart here, point at the
## nearest procedure or specialty page.
##
## Netlify applies the FIRST matching rule, so the exact paths below
## always win over the catch-alls at the end of the file.
##
## Regenerate with tools/build-redirects.py after porting any
## article, so its rule is replaced by the real page.
## ===============================================================

