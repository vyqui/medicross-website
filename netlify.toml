## ---------------------------------------------------------------
## Tratamente Turcia by Medicross — Netlify configuration
##
## The site is plain static HTML with no build step, so the
## repository root is published exactly as it is committed.
##
## The production host is Cyberfolks (cPanel/Apache) — the same
## account that already holds the domain's DNS and the outgoing
## WordPress site, so the cutover is a file swap, not a DNS change.
## This file stays the single hand-edited source of truth for every
## redirect and header rule anyway, because named TOML fields are far
## easier to review than raw .htaccess/_redirects lines. Two generator
## scripts read it and must be re-run after any change here — new
## WordPress redirect, new page, new header:
##   tools/build-htaccess.py     -> .htaccess, materials/.htaccess (Cyberfolks)
##   tools/build-cf-redirects.py -> _redirects, _headers (Cloudflare Pages)
## Netlify and Cloudflare Pages are both kept working as free
## fallback/staging deploys, in case either is ever needed again.
## ---------------------------------------------------------------

[build]
  publish = "."

## Every canonical tag on the site is extensionless — contact.html
## declares <link rel="canonical" href=".../contact"> — and sitemap.xml
## lists the same extensionless URLs. Pretty URLs make the address
## that is actually served agree with the one the page claims for
## itself; without this, every page contradicts its own canonical.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

## ---------------------------------------------------------------
## Security headers
## ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    ## SAMEORIGIN rather than DENY: portal.html embeds
    ## materials/bodymap.html in an iframe. When the portal moves to
    ## its own subdomain, bodymap.html moves with it, so this stays
    ## correct.
    X-Frame-Options = "SAMEORIGIN"
    ## Deliberately without includeSubDomains for now: the platform
    ## subdomain will be served by Railway and needs its own
    ## certificate in place before HSTS is allowed to cover it.
    ## Add includeSubDomains, then preload, once that is live.
    Strict-Transport-Security = "max-age=31536000"

## ---------------------------------------------------------------
## Caching
##
## Media filenames are stable and are not edited in place, so a week
## of browser cache is safe. CSS and JS deliberately keep Netlify's
## default ETag revalidation instead: those filenames carry no content
## hash, so a long max-age would strand visitors on a stale stylesheet
## after every deploy.
## ---------------------------------------------------------------
[[headers]]
  for = "/materials/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

## ---------------------------------------------------------------
## Not part of the public site
##
## The repository root is the publish directory, so anything committed
## here is otherwise reachable over HTTP. The API lives in server/ and
## is deployed separately to Railway; it has no business being served
## by the marketing site.
##
## Only the exact (non-wildcard) rules live here. /server/* and
## /tools/* are wildcards, so they are grouped with the other wildcard
## catch-alls near the end of this file instead — wrangler's Pages
## emulator flags a wildcard rule sitting ahead of exact rules as
## something that can shadow them, so every wildcard rule belongs
## after every exact one, full stop.
## ---------------------------------------------------------------
[[redirects]]
  from = "/README-PORTAL.md"
  to = "/"
  status = 301

[[redirects]]
  from = "/DOCUMENTATIE-TEHNICA.md"
  to = "/"
  status = 301

## ---------------------------------------------------------------
## Platform pages
##
## login.html, register.html, portal.html and admin.html used to be
## served from here too (a leftover copy from before the platform got
## its own subdomain), and every page's shared header still links to
## "portal.html" as a plain relative href — so a visitor landed on the
## stale, disconnected copy instead of the real platform on Railway.
## The copies are deleted from the repository; these redirects are
## what make that old relative link land in the right place. Add a
## new one here (not a repo-wide find/replace of the href) any time a
## page turns out to still link to one of these paths directly — the
## no-build-step site duplicates its header markup across every file.
## ---------------------------------------------------------------
[[redirects]]
  from = "/login"
  to = "https://platforma.tratamente-turcia.ro/login"
  status = 301

[[redirects]]
  from = "/login.html"
  to = "https://platforma.tratamente-turcia.ro/login"
  status = 301

[[redirects]]
  from = "/register"
  to = "https://platforma.tratamente-turcia.ro/register"
  status = 301

[[redirects]]
  from = "/register.html"
  to = "https://platforma.tratamente-turcia.ro/register"
  status = 301

[[redirects]]
  from = "/portal"
  to = "https://platforma.tratamente-turcia.ro/portal"
  status = 301

[[redirects]]
  from = "/portal.html"
  to = "https://platforma.tratamente-turcia.ro/portal"
  status = 301

[[redirects]]
